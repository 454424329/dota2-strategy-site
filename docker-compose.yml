services:
  postgres:
    image: postgres:16-alpine
    container_name: dota2-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dota2
      POSTGRES_PASSWORD: dota2_community_2026
      POSTGRES_DB: dota2
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  app:
    build: .
    container_name: dota2-strategy
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://59.110.160.9:3000}
      - DATABASE_URL=postgresql://dota2:dota2_community_2026@postgres:5432/dota2
      - AUTH_SECRET=gP4s/sUPvy+/IojgEjNn5NdzyR4ObY9taNulItObYMc=
    depends_on:
      - postgres

volumes:
  pgdata:
